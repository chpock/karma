name: Fork Docker Publish

on:
  push:
    branches:
      - karma-history
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish fork image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute fork image tag
        id: tag
        run: |
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev")
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          FORK_TAG="${BASE_VERSION}-ck-${SHORT_SHA}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "fork_tag=${FORK_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.fork_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.tag.outputs.fork_tag }}

      - name: Print published image
        run: |
          echo "Published: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.fork_tag }}"
